<div><h1>Add</h1></div>
<form class="example-form" [formGroup]="form">

<div class="row content">
  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>itemno</mat-label  >
    <input matInput formControlName="itemno" >
  </mat-form-field>
   <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Itemdesc</mat-label>
    <input matInput formControlName="itemdesc">
  </mat-form-field>
  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Locid</mat-label>
    <input matInput formControlName="locid">
  </mat-form-field>

</div>
<div class="row">
   
    <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Locdesc</mat-label>
    <input matInput formControlName="locdesc">
  </mat-form-field>

    <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Snapshotid</mat-label>
    <input matInput formControlName="snapshotid">
  </mat-form-field>
    <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Timestamp</mat-label>
    <input matInput  formControlName="Timestamp">
     
  </mat-form-field>
</div>
  <mat-form-field class="example-full-width" appearance="outline">
    <mat-label>Quantity</mat-label>
    <input matInput formControlName="Quantity">
  </mat-form-field>
<div class="row">
    <button mat-raised-button  color="primary"(click)="submit()">submit</button>

</div>
 
</form>
